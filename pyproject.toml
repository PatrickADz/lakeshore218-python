[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeshore218-python"
version = "1.3.0"
description = "Python driver for the Lakeshore Model 218 temperature monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
keysight = ["pyvisa>=1.13"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "base",
    "exceptions",
    "keysight_visa",
    "lakeshore218",
    "lakeshore218_driver",
    "prologix_ethernet",
]
